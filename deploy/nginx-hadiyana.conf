# Nginx server block for the HADIYANA static site.
# Copy to /etc/nginx/sites-available/hadiyana, then enable (see DEPLOY.md).
#
# Edit the two marked lines: server_name (your domain) and root (clone path).

server {
    listen 80;
    listen [::]:80;

    # <-- CHANGE: your domain(s). Use "_" to serve on the bare IP for testing.
    server_name hadiyana.com www.hadiyana.com;

    # <-- CHANGE: where you cloned/uploaded the site (repo root holds index.html).
    root /var/www/hadiyana;
    index index.html;

    # Pretty URLs: /features also resolves to features.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long cache for static assets
    location ~* \.(css|js|mjs|svg|woff2?|ttf|otf|jpg|jpeg|png|webp|gif|ico|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # A few sensible security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
